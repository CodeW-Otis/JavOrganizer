name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build Jellyfin ${{ matrix.jf-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - jf-version: "10.8"
            dotnet: "6.0.x"
          - jf-version: "10.9"
            dotnet: "8.0.x"

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET ${{ matrix.dotnet }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ matrix.dotnet }}

      - name: Build Jellyfin ${{ matrix.jf-version }} target
        run: >
          dotnet build Jellyfin.Plugin.JavOrganizer.csproj
          -c Release
          -p:JellyfinVersion=${{ matrix.jf-version }}
          --nologo
          -warnaserror

      - name: Verify zero warnings
        if: matrix.jf-version == '10.9'
        run: |
          output=$(dotnet build Jellyfin.Plugin.JavOrganizer.csproj -c Release -p:JellyfinVersion=10.9 --nologo 2>&1)
          if echo "$output" | grep -q "warning"; then
            echo "::error::Build produced warnings"
            exit 1
          fi

  test:
    name: Offline test suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Run the offline suite
        run: dotnet run --project tools/SmokeTest -c Release

      - name: Fail on test failures
        run: dotnet run --project tools/SmokeTest -c Release | tee test-output.txt && ! grep -q "FAIL" test-output.txt

      # The LiveScrape harness links plugin sources the same way SmokeTest
      # does, so a new source file can break it just as silently. It is built
      # here (never run - it hits the live sites) to keep it compiling.
      - name: Build the live-scrape harness
        run: dotnet build tools/LiveScrape -c Release --nologo

  release-build:
    name: Release artifacts (all six lines)
    runs-on: windows-latest
    needs: [build, test]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET (all SDKs)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            6.0.x
            8.0.x
            9.0.x
            10.0.x

      - name: Build every line
        shell: pwsh
        run: .\build.ps1

      - name: Upload dist artifacts
        uses: actions/upload-artifact@v4
        with:
          name: JavOrganizer-v${{ github.sha }}
          path: |
            dist/*.zip
            dist/*.sha256
          retention-days: 30
